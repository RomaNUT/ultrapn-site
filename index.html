<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>UltraPN</title>

  <style>
    :root {
      color-scheme: dark;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.14);
      --green: #34d399;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #020617;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 34%, rgba(96, 165, 250, 0.18), transparent 28%),
        radial-gradient(circle at 30% 80%, rgba(52, 211, 153, 0.12), transparent 26%),
        radial-gradient(circle at 78% 72%, rgba(167, 139, 250, 0.15), transparent 28%),
        linear-gradient(145deg, #020617 0%, #0f172a 48%, #030712 100%);
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.85) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.38) 1px, transparent 1px);
      background-size: 120px 120px, 190px 190px;
      background-position: 12px 24px, 64px 92px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .ring {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(78vw, 720px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow:
        0 0 120px rgba(96,165,250,.08),
        inset 0 0 90px rgba(167,139,250,.05);
      pointer-events: none;
    }

    .ring::before,
    .ring::after {
      content: "";
      position: absolute;
      inset: 11%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.06);
    }

    .ring::after {
      inset: 23%;
      border-color: rgba(96,165,250,.10);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 900px);
      padding: 44px 22px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      margin-bottom: 26px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.36);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px var(--green);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0 auto;
      max-width: 100%;
      font-size: clamp(64px, 14vw, 172px);
      line-height: .84;
      letter-spacing: -0.09em;
      font-weight: 900;
      text-shadow: 0 0 60px rgba(96,165,250,.18);
      word-break: normal;
      overflow-wrap: normal;
    }

    .subtitle {
      margin: 24px auto 0;
      color: #dbeafe;
      font-size: clamp(22px, 4vw, 42px);
      line-height: 1.12;
      font-weight: 650;
      letter-spacing: -0.045em;
    }

    .caption {
      margin: 22px auto 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .line {
      width: min(260px, 52vw);
      height: 1px;
      margin: 34px auto 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
    }

    footer {
      margin-top: 24px;
      color: rgba(148,163,184,.62);
      font-size: 13px;
      letter-spacing: .03em;
    }

    @media (max-width: 600px) {
      body {
        align-items: center;
        justify-content: center;
        padding:
          max(18px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
      }

      main {
        width: 100%;
        padding: 28px 0;
      }

      .ring {
        width: 118vw;
        opacity: 0.72;
      }

      .stars {
        opacity: 0.36;
      }

      .eyebrow {
        margin-bottom: 22px;
        padding: 9px 12px;
        font-size: 11px;
        letter-spacing: .035em;
      }

      h1 {
        font-size: clamp(58px, 19vw, 88px);
        line-height: .9;
        letter-spacing: -0.075em;
      }

      .subtitle {
        margin-top: 20px;
        font-size: clamp(23px, 7vw, 31px);
        line-height: 1.18;
        letter-spacing: -0.035em;
      }

      .caption {
        width: min(100%, 330px);
        margin-top: 18px;
        font-size: 15px;
        line-height: 1.62;
      }

      .line {
        margin-top: 28px;
        width: 190px;
      }

      footer {
        margin-top: 20px;
        font-size: 12px;
      }
    }

    @media (max-width: 390px) {
      h1 {
        font-size: clamp(54px, 18vw, 74px);
      }

      .subtitle {
        font-size: clamp(21px, 6.5vw, 27px);
      }

      .caption {
        max-width: 300px;
        font-size: 14px;
      }
    }

    @media (max-height: 680px) and (max-width: 600px) {
      main {
        padding: 18px 0;
      }

      .eyebrow {
        margin-bottom: 16px;
      }

      .subtitle {
        margin-top: 16px;
      }

      .caption {
        margin-top: 14px;
      }

      .line {
        margin-top: 20px;
      }

      footer {
        margin-top: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="ring"></div>

  <main>
    <div class="eyebrow">
      <span class="dot"></span>
      private build
    </div>

    <h1>UltraPN</h1>

    <div class="subtitle">Проект в разработке.</div>

    <p class="caption">
      Скоро здесь появится что-то большее.
    </p>

    <div class="line"></div>

    <footer>ultrapn.site</footer>
  </main>
</body>
</html>
