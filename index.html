<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>UltraPN</title>

  <style>
    :root {
      color-scheme: dark;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.14);
      --blue: #60a5fa;
      --violet: #a78bfa;
      --green: #34d399;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #020617;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 35%, rgba(96, 165, 250, 0.18), transparent 28%),
        radial-gradient(circle at 30% 80%, rgba(52, 211, 153, 0.12), transparent 26%),
        radial-gradient(circle at 78% 72%, rgba(167, 139, 250, 0.15), transparent 28%),
        linear-gradient(145deg, #020617 0%, #0f172a 48%, #030712 100%);
      overflow: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1px);
      background-size: 120px 120px, 190px 190px;
      background-position: 12px 24px, 64px 92px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .ring {
      position: fixed;
      width: min(76vw, 720px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow:
        0 0 120px rgba(96,165,250,.08),
        inset 0 0 90px rgba(167,139,250,.05);
      pointer-events: none;
    }

    .ring::before,
    .ring::after {
      content: "";
      position: absolute;
      inset: 11%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.06);
    }

    .ring::after {
      inset: 23%;
      border-color: rgba(96,165,250,.10);
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      width: min(94vw, 900px);
      padding: 48px 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.36);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px var(--green);
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 15vw, 172px);
      line-height: .82;
      letter-spacing: -0.09em;
      font-weight: 900;
      text-shadow: 0 0 60px rgba(96,165,250,.18);
    }

    .subtitle {
      margin: 24px auto 0;
      color: #dbeafe;
      font-size: clamp(22px, 4vw, 42px);
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -0.045em;
    }

    .caption {
      margin: 22px auto 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .line {
      width: min(260px, 52vw);
      height: 1px;
      margin: 34px auto 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
    }

    footer {
      margin-top: 24px;
      color: rgba(148,163,184,.62);
      font-size: 13px;
      letter-spacing: .03em;
    }

    @media (max-width: 520px) {
      main {
        padding: 30px 8px;
      }

      .eyebrow {
        margin-bottom: 22px;
        font-size: 12px;
      }

      h1 {
        font-size: clamp(58px, 20vw, 88px);
        letter-spacing: -0.08em;
      }

      .subtitle {
        margin-top: 20px;
        font-size: clamp(22px, 7vw, 30px);
      }

      .caption {
        font-size: 15px;
      }

      .ring {
        width: 118vw;
      }
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="ring"></div>

  <main>
    <div class="eyebrow">
      <span class="dot"></span>
      private build
    </div>

    <h1>UltraPN</h1>

    <div class="subtitle">Проект в разработке.</div>

    <p class="caption">
      Скоро здесь появится что-то большее.
    </p>

    <div class="line"></div>

    <footer>ultrapn.site</footer>
  </main>
</body>
</html>
